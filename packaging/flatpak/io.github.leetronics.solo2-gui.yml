id: io.github.leetronics.solo2-gui
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.11'
command: solokeys-gui

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network
  - --socket=pcsc
  - --device=all

build-options:
  env:
    - BASEAPP_REMOVE_WEBENGINE=1
    - BASEAPP_DISABLE_NUMPY=1

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/pkgconfig
  - /share/man
  - '*.a'
  - '*.la'

cleanup-commands:
  - /app/cleanup-BaseApp.sh

modules:
  - name: pcsc-lite
    buildsystem: meson
    config-opts:
      - -Dlibsystemd=false
      - -Dlibudev=false
      - -Dlibusb=false
      - -Dpolkit=false
      - -Dserial=false
      - -Dusb=false
    cleanup:
      - /sbin
    sources:
      - type: archive
        url: https://pcsclite.apdu.fr/files/pcsc-lite-2.5.1.tar.xz
        sha256: bfcfe38a20afc49849c6bf55325e38f449fc4b26d3923fdc32b969ae41a8741b

  - python3-requirements.json

  - name: solo2-python
    buildsystem: simple
    build-commands:
      - python3 -m pip install --no-deps --no-build-isolation --prefix=/app .
    sources:
      - type: git
        url: https://github.com/leetronics/solo2-python.git
        branch: main

  - name: solokeys-gui
    buildsystem: simple
    build-commands:
      - APP_VERSION="$(python3 scripts/app_version.py resolved)" && python3 scripts/app_version.py write-build-module --version "${APP_VERSION}"
      - |
        PY_SITE="$(python3 -c 'import sys; print(f"/app/lib/python{sys.version_info.major}.{sys.version_info.minor}/site-packages")')"
        install -d "${PY_SITE}"
        cp -R src/solo_gui "${PY_SITE}/"
      - install -Dm644 packaging/flatpak/io.github.leetronics.solo2-gui.desktop /app/share/applications/io.github.leetronics.solo2-gui.desktop
      - install -Dm644 packaging/flatpak/io.github.leetronics.solo2-gui.metainfo.xml /app/share/metainfo/io.github.leetronics.solo2-gui.metainfo.xml
      - install -Dm644 packaging/flatpak/io.github.leetronics.solo2-gui.png /app/share/icons/hicolor/256x256/apps/io.github.leetronics.solo2-gui.png
      - install -d /app/bin
      - printf '%s\n' '#!/bin/sh' 'exec python3 -m solo_gui.main "$@"' > /app/bin/solokeys-gui
      - printf '%s\n' '#!/bin/sh' 'exec python3 -m solo_gui.native_host "$@"' > /app/bin/solokeys-secrets-host
      - chmod 0755 /app/bin/solokeys-gui /app/bin/solokeys-secrets-host
    sources:
      - type: dir
        path: ../..
        skip:
          - .flatpak-builder
          - .git
          - .mypy_cache
          - .pytest_cache
          - .ruff_cache
          - .venv
          - build
          - dist
          - packaging/flatpak/build-dir
          - packaging/flatpak/repo
